[package]
name = "osmnxr-core"
version = "0.1.0"
authors = ["André Leite <leite@castlab.org>"]
edition = "2021"
rust-version = "1.81"
description = "Graph algorithms (routing, Pareto and constrained paths, centrality, simplification, snapping) behind osmnxr, the R port of OSMnx; no dependencies"
license = "MIT"
repository = "https://github.com/StrategicProjects/osmnxr-core"
homepage = "https://strategicprojects.github.io/osmnxr-core/"
documentation = "https://strategicprojects.github.io/osmnxr-core/api/osmnxr_core/"
readme = "README.md"
keywords = ["openstreetmap", "graph", "routing", "street-network", "osmnx"]
categories = ["algorithms", "science::geo", "data-structures"]
exclude = ["site/", ".github/", "scripts/", "CLAUDE.md"]

[dependencies]

[profile.dev]
opt-level = 2
